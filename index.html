<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESSO MATRIX - Parede 3D e Drywall</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#f6f1eb} .font-title{font-family:'Montserrat',sans-serif} .gold{color:#c9a86a}</style>
</head>
<body class="pb-24">

<header class="sticky top-0 z-40 bg-[#f6f1eb]/95 backdrop-blur-xl border-b border-black/5">
<div class="max-w-[1120px] mx-auto px-4 py-3 flex justify-between items-center">
<div id="logoTrigger" class="flex items-center cursor-pointer select-none" ondblclick="openDev()">
<span class="font-title font-black text-[22px]">GESSO <span class="gold">MATRIX</span></span>
</div>
<a href="https://wa.me/5573999084995" class="bg-black text-white text-[13px] font-black px-5 py-3 rounded-full flex items-center gap-2">73 99908-4995</a>
</div>
</header>

<section class="max-w-[520px] mx-auto px-5 py-6">
<p class="font-black text-[13px] tracking-widest mb-3">🔥 NOSSOS 3 SERVIÇOS PRINCIPAIS</p>
<div id="catalogo-produtos" class="grid grid-cols-1 gap-4"></div>
</section>

<script>
// PRODUTOS FIXOS - 3 APENAS COM SUAS FOTOS
const PRODUTOS_PADRAO = [
  {
    id: 1,
    nome: "PAREDE 3D",
    badge: "MAIS PEDIDO",
    foto: "parede3d.jpg",
    desc: "Revestimento 3D geométrico moderno"
  },
  {
    id: 2,
    nome: "FORRO COM SANCA LED",
    badge: "COM LED",
    foto: "forro-led.jpg",
    desc: "Forro liso com sanca iluminada"
  },
  {
    id: 3,
    nome: "PAREDE DRYWALL / DIVISÓRIA",
    badge: "DRYWALL",
    foto: "drywall.jpg",
    desc: "Divisória sem sujeira e sem quebra"
  }
];

let servicoSelecionado = null;

function renderProdutos(){
  const container = document.getElementById('catalogo-produtos');
  const produtos = JSON.parse(localStorage.getItem('gm_produtos') || 'null') || PRODUTOS_PADRAO;
  
  container.innerHTML = produtos.map(p => `
    <div onclick="selecionarServico(${p.id}, '${p.nome}')" class="bg-white rounded-[24px] overflow-hidden border-2 ${servicoSelecionado===p.id?'border-black':'border-black/5'} shadow-sm cursor-pointer">
      <div class="relative">
        <img src="${p.foto}" onerror="this.src='https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600'" class="w-full h-[220px] object-cover">
        <span class="absolute top-3 left-3 bg-black text-white text-[10px] font-black px-3 py-1.5 rounded-full tracking-widest">${p.badge}</span>
      </div>
      <div class="p-4 flex justify-between items-center">
        <div>
          <p class="font-black text-[15px]">${p.nome}</p>
          <p class="text-[12px] text-black/50 font-bold">${p.desc}</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-[#f6f1eb] flex items-center justify-center font-black">${servicoSelecionado===p.id?'✓':'+'}</div>
      </div>
    </div>
  `).join('');
  
  const select = document.getElementById('servico');
  if(select){
    select.innerHTML = '<option value="">Selecione o serviço</option>' + produtos.map(p=>`<option value="${p.nome}">${p.nome}</option>`).join('');
  }
}

function selecionarServico(id, nome){
  servicoSelecionado = id;
  localStorage.setItem('gm_servico', nome);
  const sel = document.getElementById('servico');
  if(sel) sel.value = nome;
  renderProdutos();
}

// Inicializa
renderProdutos();

// Resto da lógica do seu projeto original mantida
function setTipo(t){ 
  document.getElementById('btn-instalacao').className = t==='instalacao'?'flex-1 bg-black text-white rounded-[20px] py-3.5 font-black text-[13px]':'flex-1 bg-[#f6f1eb] rounded-[20px] py-3.5 font-black text-[13px]';
  document.getElementById('btn-reparo').className = t==='reparo'?'flex-1 bg-black text-white rounded-[20px] py-3.5 font-black text-[13px]':'flex-1 bg-[#f6f1eb] rounded-[20px] py-3.5 font-black text-[13px]';
  document.getElementById('painel-reparo').classList.toggle('hidden', t!=='reparo');
  document.getElementById('painel-instalacao').classList.toggle('hidden', t==='reparo');
}
function setUnidade(u){
  document.getElementById('btn-m2').className = u==='m2'?'flex-1 bg-black text-white rounded-[12px] py-3 font-black text-[12px]':'flex-1 bg-white text-black/60 rounded-[12px] py-3 font-black text-[12px]';
  document.getElementById('btn-m3').className = u==='m3'?'flex-1 bg-black text-white rounded-[12px] py-3 font-black text-[12px]':'flex-1 bg-white text-black/60 rounded-[12px] py-3 font-black text-[12px]';
  document.getElementById('alerta-m2').classList.toggle('hidden', u!=='m2');
  document.getElementById('alerta-m3').classList.toggle('hidden', u!=='m3');
}
function openDev(){ document.getElementById('devModal')?.classList.remove('hidden'); }
function closeDev(){ document.getElementById('devModal')?.classList.add('hidden'); }
</script>

</body>
</html>
